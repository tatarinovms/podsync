version: 2

project_name: "Podsync"

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/podsync/
    binary: podsync
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64

archives:
  - id: arc
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ .Tag }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  footer: |
    # Docker images
    ```
    docker pull ghcr.io/tatarinovms/podsync:{{ .Tag }}
    docker pull ghcr.io/tatarinovms/podsync:latest
    ```
