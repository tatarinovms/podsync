services:
  podsync:
    container_name: podsync
    build: .
    image: ghcr.io/tatarinovms/podsync:latest
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./data:/app/data/
      - ./db:/app/db/
      - ./config.toml:/app/config.toml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # environment:
    #   - PODSYNC_VKVIDEO_API_KEY=${VKVIDEO_API_KEY}
    #   - PODSYNC_YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    #   - PODSYNC_VIMEO_API_KEY=${VIMEO_API_KEY}
    #   - PODSYNC_SOUNDCLOUD_API_KEY=${SOUNDCLOUD_API_KEY}
