<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podsync Share</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Podsync Share</h1>
      <p>Add this page to a personal feed.</p>
    </header>

    <form id="share-form">
      <label for="feed">Personal feed</label>
      <select id="feed" required disabled>
        <option>Configure Podsync first</option>
      </select>
      <button id="open-send-settings" type="button" disabled>Add current tab</button>
      <section id="send-settings" class="hidden" aria-label="Send settings">
        <h2>Send settings</h2>
        <label for="format">Format</label>
        <select id="format">
          <option value="audio" selected>Audio (MP3)</option>
          <option value="video">Video (MP4)</option>
        </select>
        <label for="quality">Audio quality</label>
        <select id="quality">
          <option value="high" selected>High</option>
          <option value="low">Low</option>
        </select>
        <div id="video-resolution" class="hidden">
          <label for="max-height">Maximum video resolution</label>
          <select id="max-height">
            <option value="0" selected>Original</option>
            <option value="480">480p</option>
            <option value="720">720p HD</option>
            <option value="1080">1080p Full HD</option>
            <option value="1440">1440p 2K</option>
            <option value="2160">2160p 4K</option>
          </select>
        </div>
        <div class="actions"><button id="cancel-send" type="button" class="secondary">Cancel</button><button id="share" type="submit" disabled>Confirm add</button></div>
      </section>
    </form>
    <p id="status" role="status" aria-live="polite"></p>

    <details>
      <summary>Connection settings</summary>
      <form id="settings-form">
        <label for="api-url">Podsync API URL</label>
        <input id="api-url" type="url" placeholder="https://rssreader.example.com/api/v1" required>
        <label for="username">Admin username</label>
        <input id="username" type="text" autocomplete="username" required>
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Save and load feeds</button>
      </form>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
